# 4estDS 默认配置(最低优先级)。
# 分层顺序: 本文件 -> ~/.4estDS/config.yaml -> 环境变量(forestds_*) -> CLI 覆盖

app:
  name: 4estDS
  codename: forestds

logging:
  level: DEBUG             # DEBUG  INFO
  rotation_mb: 20        # 单个日志文件滚动大小(MB)
  backups: 5
  to_db: true            # 是否把 run 记录写入 run_logs 表

db:
  # 默认 SQLite(本地);设计上可平滑迁移到 PostgreSQL/PostGIS
  url: null               # 为空则使用 <home>/db/4estds.sqlite
  echo: false

preprocess:
  # COG (Cloud Optimized GeoTIFF) 检查与转换配置
  cog:
    enable: true               # 🔴 
    out_suffix: "_cog.tif"      # 转换后的输出后缀
    block_size: 512             # COG 瓦片大小 (通常为 512 或 256)
    compress: "deflate"         # 压缩算法 (deflate / lzw)
    resampling: "nearest"       # 金字塔重采样方法 (nearest/bilinear/cubic/average)
    min_overview_dim: 256       # 金字塔构建停止的最小尺寸维度

  # 切片 (Slicing) 基础配置
  slice:
    enable: true                # 推理流水线里，必须为true
    action: "none"              # 🔴 切片执行行为: slice (执行静态切片：先落盘后推理) | none (执行动态切片：仅计算参数，不落盘，边切边推理)
    default_tile: 640           # 默认切片大小            【scope.enable=false时生效】
    default_overlap: 0.2        # 默认重叠率 (0.0 - 0.5)  【scope.enable=false时生效】
    save_quality: 95            # 切片导出 JPEG 瓦片时的压缩质量

    # SCOPE 预推理自适应求解切片参数
    scope:
      enable: true              # 对 TIFF 影像是否启用 SCOPE 自标定，False 则用默认/先验参数
      seed_window_size: 2560    # 采样种子窗口边长
      sample_delta: 2           # 每一轮采样追加的种子窗口数
      sample_budget: 8          # 采样种子窗口上限数目
      nodata_tolerance: 0.10    # 每个种子窗口允许的 nodata 占比上限
      iou_threshold: 0.45       # 跨尺度合并去重的 IoU 阈值
      large_quantile: 0.95      # 用于完整性约束的大冠幅分位数
      lambda_cost: 0.15         # 算力代价在联合优化目标中的权重
      d_min_px: 24              # 最小冠幅在模型输入下的最小可检测像素 (常数，用于约束求解)
      incomplete_area_ratio: 0.9  # 非完整树过滤面积占比阈值
      incomplete_border_px: 2     # 非完整树贴边判定边界距离（像素）
      tile_grid: [512, 640, 768, 896, 1024, 1280, 1536, 2048] # 寻优边长候选集
      overlap_grid: [0.1, 0.15, 0.2, 0.25, 0.3]              # 寻优重叠率候选集
      draw_box: false           # (调试)查看预推理的效果

detect:
  arch: ultralytics       # 默认使用通用 ultralytics 后端 (自动支持 YOLO 和 RT-DETR 权重)
  conf_threshold: 0.25
  iou_threshold: 0.6
  model_input: 640        # 模型输入边长(像素)
  batch_size: 80          # 🔴 
  verbose: true           # 推理时是否输出 ultralytics 自身的详细推理日志
  models:
    ultralytics:
      weights: "m03"
      # weights: "rtdetr-l.pt"

postprocess:
  draw_box: true                 # 🔴 是否在原图(或原图中心5000*5000的子图）上绘制检测框, 并保存
  trunc_penalty: 0.5             # 局部碰边（被切断）框的置信度折扣系数
  conf_type: "max"               # 跨瓦片 WBF 融合时的置信度聚合方式
  center_merge_frac: 0.15         # 跨缝断裂拼合的中心距离门控
  keep_tiles: true               # 🔴 保留切片目录

report:
  format: "pdf"                   # 自动生成的报告默认格式 (md / pdf / csv)
  with_charts: true              # 自动生成报告时是否渲染学术分析图表 (True/False)
export:
  default_format: shp           # 🔴 推理完成后导出 GIS 图层格式。可选值: geojson | shp | gpkg | csv | null（null 表示不自动导出，仅通过 `4estds export` 手动触发）
  drop_pixel_columns: true
  drop_source_column: true

# 多源融合指标提取参数
fusion:
  height_stat: "max"             # 树高采样统计量 (max / p95 / median / mean)
  las_grid_size: 0.05            # 激光点云网格化分辨率 (米)
  dem_default: 0.0               # 单独 DSM 模式下默认常数背景 DEM 高程 (米)
  volume_method: "cbh"           # 树冠体积估算方法: cbh (枝下高积分) / paraboloid (抛物面拟合) / cone (圆锥体拟合) / ellipsoid (半椭球体拟合) / column (柱体积分) / convex_hull (点云凸包，仅在LAS模式生效) / voxel (点云体素化，仅在LAS模式生效)
  cbh_factor: 0.3                # 枝下高占树高比例 (0.0 - 1.0)
  voxel_size: 0.2                # 体素化估算方法中的三维网格单元大小 (米)







