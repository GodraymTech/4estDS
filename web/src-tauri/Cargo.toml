[package]
name = "forestds-desktop"
version = "0.1.0"
description = "4estDS 桌面壳 (方案A 瓦客户端: 仅承载前端 UI, 推理走独立后端)"
edition = "2021"
rust-version = "1.77.2"

[lib]
# 同时产出桌面/移动可用的库(Tauri v2 推荐形式)。
name = "forestds_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# 默认不启用任何权限扩展; 仅依 capabilities 声明的最小集。
custom-protocol = ["tauri/custom-protocol"]
