[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fourestds"
version = "0.1.0"
description = "4estDS - 红树林单木智能解译平台 (Mangrove individual-tree intelligent interpretation platform)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "4estDS" }]

# 核心依赖(最小可运行集)。运行时对可选重依赖做优雅降级。
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
# CLI 命令名允许以数字开头
"4estds" = "fourestds.cli:main"

# 分组依赖:做到"按模块装依赖"。本地: uv sync --extra geo --extra yolo ...
[project.optional-dependencies]
core = ["pydantic>=2", "pydantic-settings>=2", "loguru>=0.7", "typer>=0.12"]
geo = ["rasterio>=1.3", "geopandas>=0.14", "shapely>=2.0", "pyproj>=3.6", "numpy>=1.24"]
yolo = ["ultralytics>=8.3"]
rtdetr = ["ultralytics>=8.3"]
infer = ["torch>=2.2", "opencv-python-headless>=4.9", "numpy>=1.24"]
preprocess = ["numpy>=1.24", "rasterio>=1.3", "scipy>=1.11"]
report = ["matplotlib>=3.8", "plotly>=5.20", "pandas>=2.1"]
fusion = ["numpy>=1.24", "scipy>=1.11", "laspy>=2.5"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
db = ["SQLAlchemy>=2.0", "alembic>=1.13"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# uv workspace 占位(后续可拆 backend/frontend 子包)
[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
