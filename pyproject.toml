[project]
name = "forestds"
version = "0.1.0"
description = "4estDS - 林木智能检测系统 (forest detection system)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "4estDS" }]

dependencies = [
  "PyYAML>=6.0",
  "alembic>=1.18.4",
  "loguru>=0.7.3",
  "markdown-pdf>=1.13.2",
  "plotly>=6.8.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.1",
  "sqlalchemy>=2.0.51",
  "tqdm>=4.68.3",
  "typer>=0.26.7",
]

[project.scripts]
"4estds" = "forestds.cli:main"

# uv sync --extra detect --extra geo ; 或 uv sync --all-extras
[project.optional-dependencies]
detect = ["ultralytics>=8.3"]
geo = ["rasterio>=1.5.0", "shapely>=2.1.2", "geopandas>=1.1.3"]
multisource = ["laspy>=2.5"]
# 服务运行时(api+worker 共享): 任务队列 / 数据库 / 对象存储客户端。
runtime = [
  "redis>=5",
  "dramatiq[redis]>=1.16",
  "psycopg[binary]>=3.1",
  "minio>=7.2",
]
# API 服务(仅 api 容器需要): HTTP 框架与 ASGI 服务器。
server = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# uv workspace 占位(后续可拆 backend/frontend 子包)
[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
